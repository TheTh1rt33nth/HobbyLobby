apiVersion: v1
kind: Service
metadata:
  name: hobby-lobby
  namespace: hobby-lobby
spec:
  type: ClusterIP
  selector:
    app: hobby-lobby
  ports:
  - name: server
    protocol: TCP
    port: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hobby-lobby
  namespace: hobby-lobby
  labels:
    app: hobby-lobby
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hobby-lobby
  template:
    metadata:
      labels:
        app: hobby-lobby
    spec:
      containers:
      - name: hobby-lobby
        image: hobby-lobby:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        envFrom:
        - configMapRef:
            name: postgres-config
        - secretRef:
            name: postgres-secret
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"

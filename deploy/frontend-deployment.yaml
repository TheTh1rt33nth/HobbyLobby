apiVersion: v1
kind: Service
metadata:
  name: hobby-lobby-frontend
  namespace: hobby-lobby
spec:
  type: ClusterIP
  selector:
    app: hobby-lobby-frontend
  ports:
  - name: http
    protocol: TCP
    port: 80
    targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hobby-lobby-frontend
  namespace: hobby-lobby
  labels:
    app: hobby-lobby-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hobby-lobby-frontend
  template:
    metadata:
      labels:
        app: hobby-lobby-frontend
    spec:
      containers:
      - name: hobby-lobby-frontend
        image: hobby-lobby-frontend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: "50m"
            memory: "64Mi"
          limits:
            cpu: "200m"
            memory: "128Mi"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 3
          periodSeconds: 10

apiVersion: batch/v1
kind: Job
metadata:
  name: hobby-lobby-migrate
  namespace: hobby-lobby
  labels:
    app: hobby-lobby-migrate
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app: hobby-lobby-migrate
    spec:
      restartPolicy: OnFailure
      containers:
      - name: migrate
        image: hobby-lobby:latest
        imagePullPolicy: IfNotPresent
        command: ["./hobby-lobby", "migrate"]
        envFrom:
        - configMapRef:
            name: postgres-config
        - secretRef:
            name: postgres-secret
        resources:
          requests:
            cpu: "50m"
            memory: "64Mi"
          limits:
            cpu: "200m"
            memory: "128Mi"

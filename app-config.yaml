apiVersion: v1
kind: Namespace
metadata:
  name: hobby-lobby
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-config
  namespace: hobby-lobby
data:
  POSTGRES_URL: "postgres.hobby-lobby-db.svc.cluster.local"
  POSTGRES_PORT: "5432"
  POSTGRES_USER: "postgres"
  POSTGRES_DB: "postgres"
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: hobby-lobby
type: Opaque
stringData:
  POSTGRES_PASSWORD: postgres
